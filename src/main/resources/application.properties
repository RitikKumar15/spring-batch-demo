spring.application.name=spring-batch

server.port=9090

# enable debug for entire app (or use --debug on startup)
logging.level.root=INFO

# specific packages
logging.level.org.springframework=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# console pattern (timestamp, level, thread, logger)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n

# include stacktrace in error responses (useful for debugging)
server.error.include-stacktrace=always

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

file.input=classpath:static/coffee-list.dat
Spring.batch.job.enabled=false
spring.main.allow-circular-references=true

secret.key=${JWT_SECRET_KEY:default_secret_key}